name: Test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - name: Script tests
        run: |
          # Run every script before failing: `bash -e` would otherwise stop at
          # the first failing one and hide the rest.
          for t in .github/scripts/*_test.sh; do
            echo "== $t"
            bash "$t" || failed=1
          done
          exit "${failed:-0}"
