name: CI

on:
  push:
    branches: [main]
    paths:
      - "**.go"
      - go.mod
      - go.sum
  pull_request:
    branches: [main, dev]
    paths:
      - "**.go"
      - go.mod
      - go.sum

permissions:
  contents: read

jobs:
  format:
    uses: ./.github/workflows/format.yml
  build:
    uses: ./.github/workflows/build.yml
  test:
    uses: ./.github/workflows/test.yml
