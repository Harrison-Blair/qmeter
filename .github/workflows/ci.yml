name: CI

on:
  pull_request:
    branches: [main, dev]
    paths:
      - "**.go"
      - go.mod
      - go.sum
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  format:
    uses: ./.github/workflows/format.yml
  build:
    uses: ./.github/workflows/build.yml
  test:
    uses: ./.github/workflows/test.yml
