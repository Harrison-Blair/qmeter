name: Release

on:
  push:
    branches: [main]
    paths:
      - "**.go"
      - go.mod
      - go.sum

permissions:
  contents: read

# One release at a time: queue merges instead of racing them.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  format:
    uses: ./.github/workflows/format.yml
  build:
    uses: ./.github/workflows/build.yml
  test:
    uses: ./.github/workflows/test.yml

  release:
    name: Release
    needs: [format, build, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Determine version
        id: version
        run: |
          version=$(bash .github/scripts/next-version.sh "$GITHUB_SHA")
          if [ -z "$version" ]; then
            echo "$GITHUB_SHA is already tagged; skipping release."
          else
            echo "Releasing $version."
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build release archives
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dist="$PWD/dist"
          mkdir -p "$dist"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}
            arch=${target#*/}
            bin=qmeter
            if [ "$os" = windows ]; then
              bin=qmeter.exe
            fi
            stage=$(mktemp -d)
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
              -ldflags "-s -w -X github.com/Harrison-Blair/qmeter/internal/version.Version=$VERSION" \
              -o "$stage/$bin" .
            cp LICENSE README.md "$stage/"
            name="qmeter_${VERSION}_${os}_${arch}"
            if [ "$os" = windows ]; then
              (cd "$stage" && zip -q "$dist/$name.zip" "$bin" LICENSE README.md)
            else
              tar -czf "$dist/$name.tar.gz" -C "$stage" "$bin" LICENSE README.md
            fi
            rm -rf "$stage"
          done
          (cd "$dist" && sha256sum qmeter_* > checksums.txt)
          ls -l "$dist"

      - name: Create release
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes \
            dist/*.tar.gz dist/*.zip dist/checksums.txt
